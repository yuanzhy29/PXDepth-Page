<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">PXDepth</title>
  <desc id="description">PX monogram with layered depth accents in the PXDepth project colors.</desc>
  <defs>
    <linearGradient id="background" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#253eb2"/>
      <stop offset="0.56" stop-color="#6743c7"/>
      <stop offset="1" stop-color="#00a891"/>
    </linearGradient>
    <linearGradient id="depth" x1="58" y1="31" x2="78" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9dfff0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#182252" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="76" height="76" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Equal-height PX monogram derived directly from the project title. -->
  <path
    d="M20 70V26H34C45 26 50 31.5 50 40S45 54 34 54H28"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The equally sized X overlaps slightly, with a rear plane suggesting depth. -->
  <path d="M48 27L77 69M77 27L48 69" transform="translate(2 2)" fill="none" stroke="#182252" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round"/>
  <path d="M48 27L77 69M77 27L48 69" fill="none" stroke="url(#depth)" stroke-width="8" stroke-linecap="round"/>
</svg>
